<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgClean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF4F0" />
      <stop offset="100%" stop-color="#D9E6DC" />
    </linearGradient>
    <filter id="shadowCl" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#454F49" flood-opacity="0.12" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgClean)" />
  <ellipse cx="400" cy="510" rx="340" ry="40" fill="#D2DDD5" opacity="0.6" />
  <!-- Pressure Washer & Vacuum Illustration -->
  <g filter="url(#shadowCl)" transform="translate(240, 70)">
    <!-- Main Upright Pressure Washer Body -->
    <rect x="70" y="100" width="180" height="280" rx="36" fill="#3D4B43" />
    <!-- Accent Panels -->
    <rect x="90" y="140" width="140" height="120" rx="16" fill="#A8BDAE" />
    <circle cx="160" cy="200" r="28" fill="#3D4B43" />
    <!-- Dial -->
    <line x1="160" y1="200" x2="175" y2="185" stroke="#FFF" stroke-width="4" stroke-linecap="round" />
    <!-- Top Handle -->
    <path d="M110 100 L110 40 L210 40 L210 100" fill="none" stroke="#2B332E" stroke-width="20" stroke-linecap="round" />
    <!-- Wheels -->
    <circle cx="60" cy="380" r="48" fill="#242B27" />
    <circle cx="60" cy="380" r="24" fill="#697A71" />
    <circle cx="260" cy="380" r="48" fill="#242B27" />
    <circle cx="260" cy="380" r="24" fill="#697A71" />
    <!-- Hose & Spray Lance -->
    <path d="M210 320 C280 320, 310 240, 270 170" fill="none" stroke="#242B27" stroke-width="12" stroke-linecap="round" />
    <rect x="250" y="70" width="16" height="130" rx="8" fill="#5A6D63" transform="rotate(15, 250, 70)" />
    <line x1="265" y1="70" x2="275" y2="30" stroke="#8DA094" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>

