<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgDrill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF1ED" />
      <stop offset="100%" stop-color="#DCE8DF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#454F49" flood-opacity="0.12" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgDrill)" />
  <!-- Workbench surface -->
  <ellipse cx="400" cy="510" rx="340" ry="40" fill="#D2DDD5" opacity="0.6" />
  <!-- Power Drill Illustration -->
  <g filter="url(#shadow)" transform="translate(180, 100)">
    <!-- Battery Base -->
    <rect x="140" y="320" width="130" height="60" rx="14" fill="#3D4540" />
    <rect x="150" y="360" width="110" height="12" rx="4" fill="#A8BDAE" />
    <!-- Handle -->
    <path d="M190 200 L230 200 L240 320 L180 320 Z" fill="#4B5650" />
    <!-- Grip texture -->
    <rect x="195" y="230" width="30" height="6" rx="3" fill="#323935" />
    <rect x="195" y="250" width="30" height="6" rx="3" fill="#323935" />
    <rect x="195" y="270" width="30" height="6" rx="3" fill="#323935" />
    <!-- Trigger -->
    <path d="M185 220 C175 220, 175 240, 185 240 Z" fill="#A8BDAE" />
    <!-- Main Motor Body -->
    <rect x="110" y="110" width="220" height="100" rx="24" fill="#343C37" />
    <!-- Accents on Body -->
    <rect x="130" y="130" width="70" height="40" rx="8" fill="#4A564F" />
    <circle cx="165" cy="150" r="12" fill="#A8BDAE" />
    <rect x="230" y="135" width="80" height="10" rx="5" fill="#A8BDAE" />
    <!-- Chuck & Torque Selector -->
    <rect x="60" y="125" width="55" height="70" rx="10" fill="#627068" />
    <line x1="85" y1="125" x2="85" y2="195" stroke="#3D4540" stroke-width="3" />
    <!-- Chuck Tip -->
    <polygon points="35,135 60,128 60,192 35,185" fill="#3D4540" />
    <!-- Drill Bit -->
    <rect x="-40" y="156" width="75" height="8" rx="2" fill="#99A8A0" />
    <polygon points="-55,160 -40,154 -40,166" fill="#75857D" />
  </g>
</svg>

